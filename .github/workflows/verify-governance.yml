name: PMM governance
on:
  push:
    branches: ['dot/pmm-rebuild-20261005-gates']
  pull_request:
    branches: ['dot/pmm-rebuild-20261005-gates']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe current task phase
        id: task-phase
        shell: bash
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=Path('docs/agents/workflow-state.json')
          print('foundation='+str(p.exists() and json.loads(p.read_text())['activation']['phase']=='development-foundation').lower())
          PYCODE
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: steps.task-phase.outputs.foundation == 'true'
        with:
          global-json-file: 'global.json'
          dotnet-quality: 'ga'
      - name: Establish observed remote context
        shell: bash
        run: |
          git remote set-url origin https://github.com/mdjs147/PersonalMediaManager.git
          git fetch origin main:refs/remotes/origin/main dot/pmm-rebuild-20261005-gates:refs/remotes/origin/dot/pmm-rebuild-20261005-gates
          git remote set-head origin -a
          git ls-remote --symref origin HEAD refs/heads/main refs/heads/dot/pmm-rebuild-20261005-gates
      - name: Run actual runtime, context, source and failure-sensitive suites
        shell: bash
        env:
          SHELL: /bin/bash
        run: python3 scripts/verify_governance.py
